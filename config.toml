baseURL = 'https://sfnexus.org/'
locale = 'en-us'
title = 'The SF Nexus'
theme = "gohugo-theme-ananke"
canonifyURLS=true
# robots.txt comes from the theme: Allow + sitemap when HUGO_ENV=production, Disallow otherwise.
enableRobotsTXT = true
# No content uses tags or categories; the taxonomy scaffolding only produced empty
# /tags/ and /categories/ pages.
disableKinds = ['taxonomy', 'term']
# The main menu is defined only here, not in page front matter.
# Nav ordered to read as the data lifecycle: About → Source(OCR) → Curate(Data) → Analyze(Models/Analysis) → Publish(Scholarship) → People
# Stage membership and reading order live in data/lifecycle.yaml.
[menu]
[[menu.main]]
  name = 'About'
  pageRef = '/About'
  weight = 5
[[menu.main]]
  name = 'OCR'
  pageRef = '/OCR'
  weight = 10
[[menu.main]]
  name = 'Data'
  pageRef = '/Data'
  weight = 20
[[menu.main]]
  name = 'Topic Models'
  pageRef = '/Models'
  weight = 30
[[menu.main]]
  name = 'Word Embeddings'
  pageRef = '/Analysis'
  weight = 40
[[menu.main]]
  name = 'Scholarship'
  pageRef = '/Scholarship'
  weight = 50
[[menu.main]]
  name = 'People'
  pageRef = '/People'
  weight = 60

[params]
  description = "SF Nexus is a Temple University Libraries project that digitizes mid-century science fiction and shares it as open, research-ready data."
  email = "digitalscholarship@temple.edu"
  huggingface = "https://huggingface.co/SF-Corpus"
  hathitrust = "https://babel.hathitrust.org/cgi/ls?field1=ocr;q1=%2A;a=srchls;facet=htsource%3A%22Temple%20University%22"
  # Used by the {{< notebook >}} shortcode to build GitHub and Colab links.
  notebooks_repo = "SF-Nexus/extracted-features-notebooks"
  [params.ananke]
    # Extra stylesheet in assets/ananke/css/, bundled into the theme's main CSS.
    custom_css = ['sfnexus.css']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      # Lets the image render hook emit a <figure> for images that stand alone
      # on a line, instead of a <figure> nested illegally inside a <p>.
      wrapStandAloneImageWithinParagraph = false
  [markup.highlight]
    # Hugo's default (monokai) fails WCAG contrast for comments and keywords;
    # modus-operandi is a light theme designed for accessible contrast.
    style = 'modus-operandi'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  resampleFilter = 'Lanczos'
  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 82

# Mount static/images into assets/ as well, so the image render hook can resize the
# originals into responsive webp in place. Nothing moves and every /images/... link keeps
# working. Declaring mounts replaces Hugo's defaults, so the standard ones are re-listed.
[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'
