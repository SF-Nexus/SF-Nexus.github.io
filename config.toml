baseURL = 'https://sfnexus.org/'
languageCode = 'en-us'
title = 'The SF Nexus'
# The vendored ananke theme is kept only as a fallback: every template the site actually
# renders is overridden in layouts/, and the stylesheet lives in assets/css/sfnexus.css.
theme = "gohugo-theme-ananke"
enableRobotsTXT = true
# No content uses tags or categories; the taxonomy scaffolding only produced empty
# /tags/ and /categories/ pages in the sitemap.
disableKinds = ['taxonomy', 'term']

# Nav ordered to read as the data lifecycle:
# About → Source (OCR) → Curate (Data) → Analyze (Models, Analysis) → Publish (Scholarship) → People
# Stage membership and order live in data/lifecycle.yaml.
[menu]
[[menu.main]]
  name = 'About'
  pageRef = '/About'
  weight = 5
[[menu.main]]
  name = 'OCR'
  pageRef = '/OCR'
  weight = 10
[[menu.main]]
  name = 'Data'
  pageRef = '/Data'
  weight = 20
[[menu.main]]
  name = 'Topic Models'
  pageRef = '/Models'
  weight = 30
[[menu.main]]
  name = 'Word Embeddings'
  pageRef = '/Analysis'
  weight = 40
[[menu.main]]
  name = 'Scholarship'
  pageRef = '/Scholarship'
  weight = 50
[[menu.main]]
  name = 'People'
  pageRef = '/People'
  weight = 60

[params]
  description = "SF Nexus is a Temple University Libraries project that digitizes mid-century science fiction and shares it as open, research-ready data."
  tagline = "Science fiction collections as data"
  # Default social-share image when a page has no featured_image.
  og_image = "/images/about_1.jpeg"
  email = "digitalscholarship@temple.edu"
  github = "https://github.com/SF-Nexus"
  huggingface = "https://huggingface.co/SF-Corpus"
  hathitrust = "https://babel.hathitrust.org/cgi/ls?field1=ocr;q1=%2A;a=srchls;facet=htsource%3A%22Temple%20University%22"
  # Used by the {{< notebook >}} shortcode to build GitHub and Colab links.
  notebooks_repo = "SF-Nexus/extracted-features-notebooks"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      # Lets the image render hook emit a <figure> for images that stand alone
      # on a line, instead of a <figure> nested illegally inside a <p>.
      wrapStandAloneImageWithinParagraph = false
  [markup.highlight]
    # Token colors come from the retro palette in assets/css/sfnexus.css.
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[imaging]
  quality = 82
  resampleFilter = 'Lanczos'

# Mount static/images into assets/ as well, so the image render hook can resize the
# originals into responsive webp in place. Nothing moves and every /images/... link keeps
# working. Declaring mounts replaces Hugo's defaults, so the standard ones are re-listed.
[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'
