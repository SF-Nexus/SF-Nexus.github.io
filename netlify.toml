[build]
  command = "hugo --gc --minify"
  publish = "public"

# Pin Hugo so a Netlify default bump can't silently break the build.
# The vendored ananke theme predates a cascade of Hugo removals (resources.ToCSS @0.156,
# .Site.DisqusShortname @0.132, site.Social/LanguageDirection @0.158-0.160). 0.131.0 is the
# newest release that still builds this theme cleanly. To move to modern Hugo, bump the
# vendored theme to a current ananke release first, then re-pin.
[build.environment]
  HUGO_VERSION = "0.131.0"

# The ananke theme only lets search engines index the site (robots meta + robots.txt) when
# HUGO_ENV is "production". It was never set, so every page shipped as "noindex, nofollow".
# Set it for the production deploy only; deploy previews and branch deploys stay noindex.
[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --baseURL $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Force all non-canonical domains to redirect to sfnexus.org
[[redirects]]
  from = "https://sfnexus.io/*"
  to = "https://sfnexus.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sfnexus.net/*"
  to = "https://sfnexus.org/:splat"
  status = 301
  force = true

# The LDAvis model used to be published as a content page; it now lives at /ldaviz/.
[[redirects]]
  from = "/models/lda_clifi_1/*"
  to = "/ldaviz/"
  status = 301
