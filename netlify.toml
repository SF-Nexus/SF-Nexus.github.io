[build]
  command = "hugo --gc --minify"
  publish = "public"

# Pin Hugo so a Netlify default bump can't silently break the build.
# Every template the site renders now lives in layouts/ (the vendored ananke theme is only a
# fallback), so the old blockers (resources.ToCSS, .Site.DisqusShortname, .Site.Social) no
# longer apply. Before moving to a newer Hugo, run `hugo` locally with that version and check
# for warnings; then re-pin here.
[build.environment]
  HUGO_VERSION = "0.131.0"

# Deploy previews and branch deploys build as a non-production environment, so their pages
# carry `noindex` and their robots.txt disallows crawling. Only the production deploy of
# sfnexus.org is indexable (see layouts/partials/head.html and layouts/robots.txt).
[context.deploy-preview]
  command = "hugo --gc --minify --environment preview --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify --environment preview --baseURL $DEPLOY_PRIME_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Force all non-canonical domains to redirect to sfnexus.org
[[redirects]]
  from = "https://sfnexus.io/*"
  to = "https://sfnexus.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sfnexus.net/*"
  to = "https://sfnexus.org/:splat"
  status = 301
  force = true

# The LDAvis model used to be published as a content page.
[[redirects]]
  from = "/models/lda_clifi_1/*"
  to = "/ldaviz/"
  status = 301
