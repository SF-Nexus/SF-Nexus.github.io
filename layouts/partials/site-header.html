{{ $current := . }}
<header class="site-header{{ if .IsHome }} site-header--overlay{{ end }}">
  <nav class="site-nav wrap" aria-label="Main">
    <a class="brand" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>
      {{ partial "logo-mark.html" . }}
      <span class="brand__word">SF<span class="brand__sep" aria-hidden="true"> </span>Nexus</span>
    </a>
    <button class="nav-toggle" type="button" aria-controls="site-menu" aria-expanded="false">
      <span class="nav-toggle__bars" aria-hidden="true"></span>
      <span class="visually-hidden">Menu</span>
    </button>
    <ul id="site-menu" class="site-menu">
      {{ range site.Menus.main }}
      <li>
        <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </nav>
</header>
