{{ define "main" }}
<section class="lost">
  <div class="lost__inner wrap">
    <p class="kicker">Error 404 · Signal lost</p>
    <h1 class="lost__title">This page drifted out of orbit.</h1>
    <p class="lost__lede">The coordinates you followed don't match anything in the SF Nexus. The page may have moved when the site was reorganized around the data lifecycle.</p>
    <ul class="lost__links">
      <li><a class="btn btn--primary" href="{{ site.Home.RelPermalink }}">Return to base</a></li>
      <li><a class="btn btn--ghost" href="{{ "data/" | relURL }}">Get the data</a></li>
    </ul>
  </div>
</section>
{{ end }}
